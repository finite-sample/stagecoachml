[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "stagecoachml"
version = "0.2.0"
description = "A library for two-stage machine learning models with staggered feature arrival"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
maintainers = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
keywords = [
    "machine learning",
    "two-stage models",
    "staged features",
    "early prediction",
    "residual learning",
    "scikit-learn",
    "multi-stage inference",
    "feature arrival",
    "latency optimization",
    "progressive ml"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/finite-sample/stagecoachml"
Documentation = "https://finite-sample.github.io/stagecoachml/"
Repository = "https://github.com/finite-sample/stagecoachml"
"Bug Tracker" = "https://github.com/finite-sample/stagecoachml/issues"
Changelog = "https://github.com/finite-sample/stagecoachml/blob/main/CHANGELOG.md"


[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["stagecoachml", "tests"]
extend-include = ["*.ipynb"]
extend-exclude = ["examples/**"]

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF", "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY", "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF", "PL", "TCH", "TID"]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "PLR0913", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# N803/N806: this is a scikit-learn estimator library, and sklearn's API *is*
# capitalised — `fit(self, X, y)`, `X_early`, `X_late`. Renaming them to satisfy
# pep8-naming would break the convention every user of the library reads by.
# PLR0917: an sklearn estimator's hyperparameters must each be an explicit
# named `__init__` parameter for `get_params`/`clone`/`GridSearchCV` to work,
# so the count is set by the model, not by style.
"stagecoachml/**" = ["N803", "N806", "PLR0917"]
# Unused fixture arguments and private-member access are how tests are written;
# PLC0415 covers imports deliberately deferred into a single test.
"tests/**" = ["S101", "D", "ARG", "SLF", "N803", "N806", "PLC0415"]
"docs/**" = ["D"]
# A teaching notebook communicates by printing, and its output uses symbols
# (ℹ) that RUF001 reads as homoglyphs.
"docs/notebooks/**" = ["D", "T201", "RUF001", "N803", "N806"]
"__init__.py" = ["F401", "D104"]

[tool.ruff.lint.isort]
known-first-party = ["stagecoachml"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers", "--strict-config", "-ra"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as benchmarks"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning"
]
log_level = "INFO"
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["stagecoachml"]
omit = [
    "*/tests/*",
    "*/__init__.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@overload"
]
precision = 2
show_missing = true

[tool.pyright]
include = ["stagecoachml"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.preen]
# Resolves only once this file is on the default branch; on a feature branch
# the link check sees a 404 for a file that is right there in the diff.
link_ignore = ["github.com/finite-sample/stagecoachml/blob/main/CHANGELOG.md"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    # Repo-specific: the docs render an executable quickstart notebook
    # (myst-nb), a sphinx-design button, and an in-browser JupyterLite build.
    "myst-nb>=1.0.0",
    "sphinx-design>=0.5.0",
    "jupyterlite-sphinx>=0.22.0",
    "jupyterlite-pyodide-kernel>=0.7.0",
]
